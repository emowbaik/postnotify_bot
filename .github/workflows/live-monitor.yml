name: PostNotify Live Monitor

on:
  # ── Manual start (first time / restart after loop dies) ──────────────────
  workflow_dispatch:

  # ── Daily safety restart: ensures loop auto-revives if it ever dies ───────
  # Runs at 00:00 UTC every day
  schedule:
    - cron: '0 0 * * *'

  # ── Self-trigger: the loop fires this event at the end of each run ────────
  repository_dispatch:
    types: [postnotify-live-check]

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Never cancel a state-bearing run: it may have sent Discord alerts before
    # state.json is committed. Overlapping triggers wait for the active run.
    concurrency:
      group: live-monitor
      cancel-in-progress: false

    permissions:
      contents: write   # state push and repository_dispatch use the job-scoped token

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch || 'master' }}
          fetch-depth: 0
          persist-credentials: false

      # ── 2. Load runtime state from its non-code branch ─────────────────────
      - name: Load runtime state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATE_BRANCH: postnotify-state
        run: |
          state_base_sha="$(
            gh api "repos/$REPO/git/ref/heads/$STATE_BRANCH" --jq '.object.sha'
          )"
          printf 'STATE_BASE_SHA=%s\n' "$state_base_sha" >> "$GITHUB_ENV"
          gh api "repos/$REPO/contents/state.json?ref=$state_base_sha" --jq '.content' \
            | tr -d '\n' \
            | base64 --decode > state.json
          test -s state.json

      # ── 3. Setup exact Bun runtime ─────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      # ── 4. Install dependencies and multilingual fonts ────────────────────
      - name: Install multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
          fc-cache -f

      - name: Install dependencies
        run: npm ci

      # ── 5. Run the live check & notify ────────────────────────────────────
      - name: Check live status & send notifications
        env:
          DISCORD_BOT_TOKEN:          ${{ secrets.DISCORD_BOT_TOKEN }}
          TIKTOK_DISCORD_CHANNEL_ID:  ${{ secrets.TIKTOK_DISCORD_CHANNEL_ID }}
          TIKTOK_DISCORD_MENTION:     ${{ secrets.TIKTOK_DISCORD_MENTION }}
          TIKTOK_USERNAMES:           ${{ secrets.TIKTOK_USERNAMES }}
          YOUTUBE_CHANNEL_IDS:        ${{ secrets.YOUTUBE_CHANNEL_IDS }}
          YOUTUBE_API_KEY:            ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DISCORD_CHANNEL_ID: ${{ secrets.YOUTUBE_DISCORD_CHANNEL_ID }}
          YOUTUBE_DISCORD_MENTION:    ${{ secrets.YOUTUBE_DISCORD_MENTION }}
          ADMIN_DISCORD_CHANNEL_ID:   ${{ secrets.ADMIN_DISCORD_CHANNEL_ID }}
          ADMIN_DISCORD_MENTION:      ${{ secrets.ADMIN_DISCORD_MENTION }}
        run: bun run src/app.ts

      # ── 6. Commit state.json to the fast-forward-only state branch ────────
      - name: Commit state changes
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: postnotify-state
          STATE_WORKTREE: ${{ runner.temp }}/postnotify-state
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Sync attempt $attempt/3 against origin/$STATE_BRANCH..."
            git fetch --no-tags origin "$STATE_BRANCH"
            remote_sha="$(git rev-parse "origin/$STATE_BRANCH")"

            if [ "$remote_sha" != "$STATE_BASE_SHA" ]; then
              git show "origin/$STATE_BRANCH:state.json" > "$RUNNER_TEMP/postnotify-remote-state.json"
              if cmp -s state.json "$RUNNER_TEMP/postnotify-remote-state.json"; then
                echo "State was already persisted by an earlier push attempt."
                exit 0
              fi

              echo "State branch advanced after this run loaded it; refusing to overwrite newer state."
              exit 1
            fi

            git worktree remove --force "$STATE_WORKTREE" 2>/dev/null || true
            rm -rf "$STATE_WORKTREE"
            git worktree add --detach "$STATE_WORKTREE" "$remote_sha"
            cp state.json "$STATE_WORKTREE/state.json"

            git -C "$STATE_WORKTREE" add state.json
            if git -C "$STATE_WORKTREE" diff --cached --quiet -- state.json; then
              echo "No state changes to commit."
              git worktree remove --force "$STATE_WORKTREE"
              exit 0
            fi

            git -C "$STATE_WORKTREE" commit -m "chore: sync state.json [skip ci]" state.json
            if git -C "$STATE_WORKTREE" push origin "HEAD:$STATE_BRANCH"; then
              git worktree remove --force "$STATE_WORKTREE"
              exit 0
            fi

            git worktree remove --force "$STATE_WORKTREE"
            sleep $((attempt * 2))
          done

          echo "Failed to push state after 3 synchronized attempts."
          exit 1

      # ── 7. Sleep 300 seconds before triggering next loop ─────────────────
      # This creates an approximately 5-minute polling interval.
      - name: Wait before next check
        run: |
          echo "Sleeping 300 seconds before triggering next check..."
          sleep 300

      # ── 8. Self-trigger with the short-lived job token ────────────────────
      # repository_dispatch is an explicit GITHUB_TOKEN recursion exception.
      - name: Trigger next loop iteration
        if: always()   # fire even if earlier steps fail, so the loop never dies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔁 Triggering next check cycle..."
          if printf '%s' '{"event_type":"postnotify-live-check"}' \
            | gh api --method POST "repos/$REPO/dispatches" --input - >/dev/null; then
            echo "✅ Next iteration triggered successfully."
          else
            echo "❌ Failed to trigger next iteration."
            exit 1
          fi

  # ── Cleanup: permanently remove completed runs from this workflow only ────
  # This job has no checkout and no bot/API secrets. The current run is never
  # returned by status=completed, so active and queued runs remain untouched.
  cleanup-completed-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: postnotify-run-cleanup
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: Delete completed monitor runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: live-monitor.yml
        run: |
          mapfile -t run_ids < <(
            gh api --paginate \
              "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "cancelled")) | .id'
          )

          echo "Found ${#run_ids[@]} successful/cancelled monitor run(s) to delete."
          for run_id in "${run_ids[@]}"; do
            echo "Deleting successful/cancelled monitor run: $run_id"
            gh api --method DELETE "repos/$REPO/actions/runs/$run_id"
          done
          echo "Cleanup complete. Failed/error, unknown, active, and queued runs were preserved for manual deletion."

  # ── Keepalive: mencegah GitHub menonaktifkan scheduled workflow ───────────
  # GitHub menonaktifkan scheduled workflow setelah 60 hari tanpa aktivitas.
  # Job ini berjalan setiap kali cron schedule terpicu dan mengaktifkan ulang
  # workflow jika GitHub menandainya sebagai disabled.
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
